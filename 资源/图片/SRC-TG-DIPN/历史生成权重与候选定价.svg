<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>商品历史生成权重与候选定价</title>
  <desc>历史经Transformer产生基础矩阵组合系数，生成的网络处理静态特征，输出非负需求因子。按降价方向打开遮罩得到销量，逐档计算利润。全部数值为教学构造。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183047;font-size:21px}.label{font-size:18px;fill:#42566c}.small{font-size:17px;fill:#42566c}.head{font-size:27px;font-weight:600}.bold{font-weight:600}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.box{stroke-width:1.8;rx:14}</style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="40" y="48" class="head">先由历史生成网络，再对同一商品比较候选价格</text>
  <text x="40" y="79" class="label">依据TG-DIPricingNets §2与附录A自主绘制；示例系数、销量均为构造值</text>
  <rect x="40" y="110" width="265" height="145" class="box" stroke="#7194af" fill="#eaf2f8"/>
  <text x="62" y="147" class="bold">过去30天商品历史 H</text>
  <text x="62" y="184">每日价格、销量、浏览量</text>
  <text x="62" y="220" class="label">30 × 3；不含目标日真值</text>
  <path d="M305 183H350" class="line"/>
  <rect x="350" y="110" width="280" height="145" class="box" stroke="#7194af" fill="#eaf2f8"/>
  <text x="375" y="147" class="bold">Transformer → 系数 α</text>
  <text x="375" y="184">教学例：α = (0.5, 0.5)</text>
  <text x="375" y="220" class="label">原文未规定Softmax归一化</text>
  <path d="M630 183H675" class="line"/>
  <rect x="675" y="110" width="485" height="145" class="box" stroke="#8c88b9" fill="#efedf9"/>
  <text x="700" y="147" class="bold">公共基础矩阵 → 当前商品参数</text>
  <text x="700" y="184">W(H) = Σ αᵣ(H) Bᵣ</text>
  <text x="700" y="220" class="label">共享生成器与矩阵库；当前前向产生W</text>
  <path d="M910 255V281H490V308" class="line"/>
  <text x="700" y="280" class="small">生成的权重用于下方网络</text>
  <rect x="40" y="310" width="265" height="160" class="box" stroke="#a29972" fill="#fff8df"/>
  <text x="62" y="348" class="bold">当前静态信息 x</text>
  <text x="62" y="387">服务、商家等属性</text>
  <text x="62" y="428" class="label">教学商品：原价100元</text>
  <text x="62" y="453" class="label">单位成本60元</text>
  <path d="M305 390H350" class="line"/>
  <rect x="350" y="310" width="280" height="160" class="box" stroke="#8c88b9" fill="#efedf9"/>
  <text x="374" y="348" class="bold">实例专属需求网络</text>
  <text x="374" y="387">特征编码 → 两个解码器</text>
  <text x="374" y="428" class="label">非负基础量 b = 10</text>
  <text x="374" y="453" class="label">非负因子 a = (1, 0.5, 0.5)</text>
  <path d="M630 390H675" class="line"/>
  <rect x="675" y="310" width="485" height="160" class="box" stroke="#6a9d88" fill="#eaf6ee"/>
  <text x="700" y="348" class="bold">价格越低，打开的非负因子越多</text>
  <text x="700" y="387">Q(d[j]) = b × Σ a[k]（k ≤ j）</text>
  <text x="700" y="428" class="label">降价：100 → 90 → 80元</text>
  <text x="700" y="453" class="label">遮罩：100 → 110 → 111</text>
  <path d="M910 470V505" class="line"/>
  <rect x="40" y="505" width="1120" height="152" class="box" stroke="#6a9d88" fill="white"/>
  <text x="70" y="540" class="bold">候选价格（元）</text><text x="355" y="540">100</text><text x="585" y="540">90</text><text x="815" y="540">80</text>
  <text x="70" y="578" class="bold">预测销量（件）</text><text x="355" y="578">10</text><text x="585" y="578">15</text><text x="815" y="578">20</text>
  <text x="70" y="618" class="bold">预计利润（元）</text><text x="355" y="618">400</text><rect x="554" y="590" width="124" height="43" rx="8" fill="#d8f0df"/><text x="580" y="618" class="bold">450 ✓</text><text x="815" y="618">400</text>
  <text x="70" y="690" class="label">单调约束作用于预测需求；90元的利润最大。历史相关性和单调形状均不自动证明因果收益。</text>
</svg>
