<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-label="GPT预训练与任务微调的参数迁移和输出变化"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#466487"/></marker></defs><rect width="720" height="790" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="26" y="35" font-size="25" fill="#22334B" font-weight="700">GPT：迁移的是参数，不是预测出的词</text><text x="26" y="66" font-size="18" fill="#596D83">中文符号与概率均为教学构造；省略层内算子</text><rect x="24" y="87" width="672" height="273" rx="9" fill="#E9F1FA" stroke="#AFC1D8"/><text x="42" y="117" font-size="22" fill="#22334B" font-weight="700">① 连续文本预训练：每行预测下一 Token</text><rect x="50" y="135" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="99" y="161" font-size="20" fill="#22334B">S</text><path d="M117 177 L117 192" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="212" y="135" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="261" y="161" font-size="20" fill="#22334B">我</text><path d="M279 177 L279 192" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="374" y="135" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="423" y="161" font-size="20" fill="#22334B">爱</text><path d="M441 177 L441 192" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="536" y="135" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="585" y="161" font-size="20" fill="#22334B">猫</text><path d="M603 177 L603 192" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="50" y="198" width="620" height="48" rx="9" fill="#D9E8FB" stroke="#AFC1D8"/><text x="95" y="229" font-size="22" fill="#22334B" font-weight="700">共享词表 + 位置 → 12 层因果骨干</text><path d="M117 251 L117 267" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="50" y="274" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="86" y="300" font-size="18" fill="#22334B">预测 我</text><path d="M279 251 L279 267" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="212" y="274" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="248" y="300" font-size="18" fill="#22334B">预测 爱</text><path d="M441 251 L441 267" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="374" y="274" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="410" y="300" font-size="18" fill="#22334B">预测 猫</text><path d="M603 251 L603 267" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="536" y="274" width="134" height="38" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="572" y="300" font-size="18" fill="#22334B">预测 E</text><text x="45" y="341" font-size="19" fill="#22334B">四行各有词表分布；输入标签错位，Loss 沿有效行归约</text><path d="M360 367 L360 404" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="385" y="391" font-size="18" fill="#22334B">复制参数作为初始化</text><rect x="24" y="416" width="672" height="286" rx="9" fill="#F1F7F2" stroke="#B5CBB9"/><text x="42" y="448" font-size="22" fill="#22334B" font-weight="700">② 情感微调：同一文本，另用任务标签</text><text x="50" y="485" font-size="23" fill="#22334B">Start   我   爱   猫   Extract</text><path d="M360 499 L360 515" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="50" y="523" width="620" height="48" rx="9" fill="#D9EAD9" stroke="#AFC1D8"/><text x="116" y="554" font-size="21" fill="#22334B" font-weight="700">迁入骨干继续训练 + 新标记 + 新头</text><path d="M360 577 L360 593" stroke="#466487" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="78" y="602" width="564" height="43" rx="9" fill="#FFFFFF" stroke="#AFC1D8"/><text x="107" y="630" font-size="20" fill="#22334B">取 Extract 状态 → 两类分数 → 任务 Loss</text><text x="46" y="680" font-size="19" fill="#22334B">可选辅助 LM 同时训练；两项梯度回到共享骨干</text><text x="27" y="738" font-size="19" fill="#22334B">分类使用：只给文本与标记，一次读出类别，不给真值标签</text><text x="27" y="768" font-size="17" fill="#596D83">S / E 仅为教学边界；原论文图 1、§3.1–3.3 为机制依据</text></g></svg>
