<svg xmlns="http://www.w3.org/2000/svg" width="720" height="542" viewBox="0 0 720 542" role="img" aria-label="GPT右填充任务输入的因果可见性、错位损失与分类读出"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#466487"/></marker></defs><rect width="720" height="542" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="25" y="35" font-size="25" fill="#22334B" font-weight="700">同一条任务输入：三种选择分别管什么</text><text x="25" y="66" font-size="18" fill="#596D83">右填充示例；行号从 0 开始，Extract 是末有效项</text><rect x="146" y="89" width="83" height="44" rx="9" fill="#E7EFFA" stroke="#AFC1D8"/><text x="155" y="118" font-size="18" fill="#22334B">Start</text><text x="177" y="158" font-size="18" fill="#22334B">0</text><rect x="238" y="89" width="83" height="44" rx="9" fill="#E7EFFA" stroke="#AFC1D8"/><text x="247" y="118" font-size="18" fill="#22334B">我</text><text x="269" y="158" font-size="18" fill="#22334B">1</text><rect x="330" y="89" width="83" height="44" rx="9" fill="#E7EFFA" stroke="#AFC1D8"/><text x="339" y="118" font-size="18" fill="#22334B">爱</text><text x="361" y="158" font-size="18" fill="#22334B">2</text><rect x="422" y="89" width="83" height="44" rx="9" fill="#E7EFFA" stroke="#AFC1D8"/><text x="431" y="118" font-size="18" fill="#22334B">猫</text><text x="453" y="158" font-size="18" fill="#22334B">3</text><rect x="514" y="89" width="83" height="44" rx="9" fill="#E7EFFA" stroke="#AFC1D8"/><text x="523" y="118" font-size="18" fill="#22334B">Extract</text><text x="545" y="158" font-size="18" fill="#22334B">4</text><rect x="606" y="89" width="83" height="44" rx="9" fill="#EDEDED" stroke="#AFC1D8"/><text x="615" y="118" font-size="18" fill="#22334B">PAD</text><text x="637" y="158" font-size="18" fill="#22334B">5</text><text x="25" y="118" font-size="20" fill="#22334B" font-weight="700">输入</text><text x="25" y="157" font-size="20" fill="#22334B" font-weight="700">行号</text><rect x="24" y="178" width="672" height="82" rx="9" fill="#F3F6FA" stroke="#AFC1D8"/><text x="39" y="205" font-size="20" fill="#22334B" font-weight="700">因果可见性</text><text x="39" y="234" font-size="18" fill="#22334B">“爱”行只看 Start、我、爱；Extract 可看全部有效前缀</text><text x="25" y="299" font-size="20" fill="#22334B" font-weight="700">LM目标</text><text x="154" y="299" font-size="18" fill="#22334B">我</text><text x="246" y="299" font-size="18" fill="#22334B">爱</text><text x="338" y="299" font-size="18" fill="#22334B">猫</text><text x="430" y="299" font-size="18" fill="#22334B">Extract</text><text x="522" y="299" font-size="18" fill="#22334B">PAD</text><text x="25" y="340" font-size="20" fill="#22334B" font-weight="700">Loss选择</text><text x="176" y="340" font-size="20" fill="#2C6B48">1</text><text x="268" y="340" font-size="20" fill="#2C6B48">1</text><text x="360" y="340" font-size="20" fill="#2C6B48">1</text><text x="452" y="340" font-size="20" fill="#2C6B48">1</text><text x="544" y="340" font-size="20" fill="#9A4545">0</text><rect x="24" y="365" width="672" height="90" rx="9" fill="#F0F7F1" stroke="#AFC1D8"/><text x="39" y="393" font-size="20" fill="#22334B" font-weight="700">分类读出</text><text x="39" y="423" font-size="19" fill="#22334B">只取第 4 行 Extract；不取最后数组列，不做 Mean</text><text x="26" y="489" font-size="17" fill="#596D83">官方右填充脚本：Attention 仅因果遮罩；M 用于错位 LM Loss</text><text x="26" y="518" font-size="18" fill="#596D83">有效前缀本就读不到右侧 PAD；改填充方向须重新核对</text></g></svg>
