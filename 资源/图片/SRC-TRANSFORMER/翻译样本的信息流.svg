<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Transformer翻译训练：源端记忆、右移目标与每行监督</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52718b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="40" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#16324f">Transformer：同一翻译样本怎样训练</text>
<text x="30" y="73" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#53687c">教学符号与布局；省略投影、FFN、残差及层数，不是论文原图</text>
<rect x="25" y="100" width="205" height="330" rx="9" fill="#edf7ef" stroke="#b9cbd9"/>
<text x="45" y="135" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#16324f">源端：双向编码</text>
<rect x="46" y="157" width="160" height="43" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="126" y="186" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#16324f">我 → z₁</text>
<rect x="46" y="218" width="160" height="43" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="126" y="247" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#16324f">爱 → z₂</text>
<rect x="46" y="279" width="160" height="43" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="126" y="308" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#16324f">音乐 → z₃</text>
<text x="46" y="382" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#16324f">全部源状态作K/V</text>
<text x="46" y="409" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#16324f">每个目标行可读取</text>
<rect x="290" y="100" width="325" height="330" rx="9" fill="#edf4ff" stroke="#b9cbd9"/>
<text x="311" y="135" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#16324f">目标输入 → 上下文状态</text>
<rect x="313" y="157" width="278" height="42" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="329" y="185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#16324f">行0   BOS → h₀</text>
<line x1="230" y1="178" x2="290" y2="178" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="615" y1="178" x2="679" y2="178" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="313" y="215" width="278" height="42" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="329" y="243" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#16324f">行1   I → h₁</text>
<line x1="230" y1="236" x2="290" y2="236" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="615" y1="236" x2="679" y2="236" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="313" y="273" width="278" height="42" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="329" y="301" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#16324f">行2   love → h₂</text>
<line x1="230" y1="294" x2="290" y2="294" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="615" y1="294" x2="679" y2="294" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="313" y="331" width="278" height="42" rx="9" fill="#ffffff" stroke="#b9cbd9"/>
<text x="329" y="359" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#16324f">行3   music → h₃</text>
<line x1="230" y1="352" x2="290" y2="352" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="615" y1="352" x2="679" y2="352" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="679" y="100" width="255" height="330" rx="9" fill="#fff7eb" stroke="#b9cbd9"/>
<text x="699" y="135" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#16324f">词表分布 → 真值</text>
<text x="701" y="185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#16324f">p0(全部词) → I</text>
<text x="701" y="243" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#16324f">p1(全部词) → love</text>
<text x="701" y="301" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#16324f">p2(全部词) → music</text>
<text x="701" y="359" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#16324f">p3(全部词) → EOS</text>
<text x="30" y="466" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#16324f">目标行可见范围：BOS；BOS I；BOS I love；BOS I love music</text>
<text x="30" y="500" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#16324f">训练四行并行；推理从BOS开始，用已生成前缀逐步预测，直到EOS。</text>
</svg>
