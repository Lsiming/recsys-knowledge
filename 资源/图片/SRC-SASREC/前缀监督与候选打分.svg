<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img"><title>SASRec：前缀输入、因果边界、采样监督与末行候选打分</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52718b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="40" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#16324f">SASRec：同一历史的四个前缀监督</text>
<text x="30" y="72" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#53687c">教学历史 A B C D E；固定窗口5，输入排除末项E</text>
