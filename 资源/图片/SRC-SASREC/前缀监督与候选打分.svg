<text x="540" y="224" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#16324f">B</text>
<text x="720" y="224" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#16324f">J₂</text>
