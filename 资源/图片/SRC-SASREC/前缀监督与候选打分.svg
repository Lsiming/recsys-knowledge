<text x="180" y="398" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#16324f">A B C D</text>
<text x="540" y="398" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#16324f">E</text>
<text x="720" y="398" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#16324f">J₅</text>
<line x1="410" y1="391" x2="503" y2="391" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="465" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#16324f">末行状态 h₅：r(E) = h₅·M_E，r(J₅) = h₅·M_J₅</text>
<text x="30" y="500" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#16324f">训练：每有效行一对采样BCE；推荐：最后有效状态给候选逐一打分。</text>
<text x="30" y="531" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#53687c">候选只在末端打分进入；不为每个候选重算整段历史注意力。</text>
</svg>
