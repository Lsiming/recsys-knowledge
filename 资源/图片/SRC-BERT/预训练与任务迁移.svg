<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-label="BERT损坏输入、两种预训练读出与任务迁移">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42566e"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b45;font-size:20px}.small{font-size:17px}.title{font-size:26px;font-weight:700}.label{font-size:21px;font-weight:600}.arrow{fill:none;stroke:#42566e;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="810" fill="#fff"/>
<text x="560" y="42" class="title" text-anchor="middle">BERT：同一骨干，不同位置、不同预测目标</text>
<rect x="40" y="66" width="1040" height="74" rx="9" fill="#edf3fb" stroke="#9bacbf"/>
<text x="560" y="95" class="" text-anchor="middle">输入：[CLS] 我 买 了 [MASK] [SEP] 它 可以 拍 灯 [SEP] [PAD]</text>
<text x="560" y="123" class="small" text-anchor="middle">每位置：Token向量 + A/B片段向量 + 位置向量；标签保留原文</text>
<path class="arrow" d="M560 140 L560 175"/>
<rect x="155" y="178" width="810" height="90" rx="9" fill="#dcecf9" stroke="#4e8ab5"/>
<text x="560" y="213" class="label" text-anchor="middle">双向Transformer编码器 × L层</text>
<text x="560" y="245" class="small" text-anchor="middle">有效位置互相可见；PAD Key不可读；每位置都有d维状态</text>
<path class="arrow" d="M560 268 L560 308"/>
<rect x="155" y="310" width="810" height="59" rx="9" fill="#edf3fb" stroke="#9bacbf"/>
<text x="560" y="347" class="" text-anchor="middle">全部隐藏状态 H：[B, T, d]；本例 [1, 12, d]</text>
<path class="arrow" d="M380 369 L300 408"/>
<path class="arrow" d="M740 369 L820 408"/>
<rect x="55" y="412" width="490" height="110" rx="9" fill="#e2f2ea" stroke="#67a786"/>
<text x="300" y="447" class="label" text-anchor="middle">MLM：选位置4、9 → 词表头</text>
<text x="300" y="478" class="" text-anchor="middle">恢复“相机”“照”，每个目标有V个分数</text>
<text x="300" y="506" class="small" text-anchor="middle">平均词交叉熵 ≈ 0.5249（教学概率）</text>
<rect x="575" y="412" width="490" height="110" rx="9" fill="#fff0d7" stroke="#c39a52"/>
<text x="820" y="447" class="label" text-anchor="middle">NSP：选位置0（CLS）→ 关系头</text>
<text x="820" y="478" class="" text-anchor="middle">预测 IsNext / NotNext 两类</text>
<text x="820" y="506" class="small" text-anchor="middle">关系交叉熵 ≈ 0.2231（教学概率）</text>
<text x="560" y="556" class="label" text-anchor="middle">两项均值相加 → 反向传播到各头与共享骨干</text>
<path d="M40 583 H1080" stroke="#b4bec9" stroke-dasharray="7 5"/>
<text x="560" y="616" class="label" text-anchor="middle">迁移的是预训练参数；每个任务另行微调</text>
<path class="arrow" d="M560 625 L560 655" stroke-dasharray="7 5"/>
<rect x="40" y="662" width="1040" height="99" rx="9" fill="#f1eef9" stroke="#9f8dbe"/>
<text x="560" y="695" class="" text-anchor="middle">正常文本 → 从预训练参数初始化的BERT + 对应任务头</text>
<text x="560" y="728" class="" text-anchor="middle">CLS → 类别　｜　词位置 → NER标签　｜　段落位置 → 起点/终点</text>
<text x="560" y="785" class="small" text-anchor="middle">原创示意，依据BERT v2 §3–4；省略Block及头内部，非作者原图。</text>
</svg>